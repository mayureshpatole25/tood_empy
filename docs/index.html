<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tood, a to-do list app for macOS</title>
<meta name="description" content="Tood is a native Mac app: sticky notes that live right on your desktop. Download for free.">
<link rel="icon" href="assets/toodicon.png?v=2">
<link rel="canonical" href="https://toodapp.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://toodapp.com/">
<meta property="og:title" content="Tood, a to-do list app for macOS">
<meta property="og:description" content="Little to-dos that live right on your desktop. Download for free.">
<meta property="og:image" content="https://toodapp.com/assets/og-image.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="742">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tood, a to-do list app for macOS">
<meta name="twitter:description" content="Little to-dos that live right on your desktop. Download for free.">
<meta name="twitter:image" content="https://toodapp.com/assets/og-image.jpg?v=2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" id="scene">
  <div class="scene-bg"></div>
  <div class="menubar">
    <div class="left">
      <svg class="apple-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zm3.63-3.325c.831-1.012 1.395-2.402 1.24-3.805-1.201.052-2.674.799-3.55 1.812-.774.884-1.443 2.31-1.267 3.674 1.31.104 2.678-.68 3.578-1.68z"/></svg>
      <span class="app-name">Tood</span>
      <span class="dim">File</span>
      <span class="dim">Edit</span>
      <span class="dim">View</span>
      <span class="dim">Window</span>
    </div>
    <div class="right"><span id="clock">Fri 8:41 PM</span></div>
  </div>

  <div class="topbar">
    <span></span>
    <a class="top-download" href="https://github.com/reneezhang99/to-do-app/releases/download/v1.0.0/Tood.dmg" id="topDownload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m6 11 6 6 6-6"/><path d="M5 21h14"/></svg>
      Download for Mac
    </a>
  </div>

  <div class="cards-row">
    <div class="headline-card card-shared" id="headlineCard">
      <div class="headline-lines">
        <div>Things</div><div>To</div><div>Do</div><div>Today</div>
      </div>
      <p class="headline-blurb">Little to-dos that live on your desktop.</p>
    </div>
    <div class="sticky card-shared" id="sticky">
      <div class="sticky-head">
        <div class="sticky-title">To Do</div>
        <div class="sticky-date" id="sdate"></div>
      </div>
      <div id="stickyRows"></div>
    </div>
  </div>

  <div class="credit">Made with care by <a href="https://renee.wiki/" target="_blank" rel="noopener">Renee</a> — Sydney &amp; California</div>
  <div class="requirements">macOS 14+ · Apple Silicon &amp; Intel</div>

  <div class="dock-wrap">
    <ul class="dock" id="dock">
      <li class="dock-item plain">
        <img src="assets/dock/finder.png" alt="Finder">
        <span class="dock-tooltip">Finder</span>
      </li>
      <li class="dock-item plain">
        <img src="assets/dock/notes.png" alt="Notes">
        <span class="dock-tooltip">Notes</span>
      </li>
      <li class="dock-item plain">
        <img src="assets/dock/slack.png?v=2" alt="Slack">
        <span class="dock-tooltip">Slack</span>
      </li>
      <li class="dock-item tood">
        <img src="assets/icon.png?v=3" alt="Tood">
        <span class="dock-tooltip">Tood</span>
      </li>
      <li class="dock-item plain">
        <img src="assets/dock/claude.png" alt="Claude">
        <span class="dock-tooltip">Claude</span>
      </li>
      <li class="dock-item plain">
        <img src="assets/dock/safari.png" alt="Safari">
        <span class="dock-tooltip">Safari</span>
      </li>
    </ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
